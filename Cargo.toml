[workspace]
resolver = "3"
members = ["crates/otto-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
authors = ["Mike Laufersweiler <mhlauf1@gmail.com>"]

[workspace.dependencies]
otto-core = { path = "crates/otto-core" }
portable-pty = "=0.9.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tempfile = "=3.27.0"
uuid = { version = "=1.28.0", features = ["v4"] }
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = { version = "=2.12.4" }
tauri-build = { version = "2" }
tauri-plugin-dialog = "=2.8.3"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
